<!DOCTYPE html>
<html>
<head>
    <title>A to B chat</title>
</head>
<body>

    <h1>A to B chat</h1>

    <input id="username" placeholder="Your username">
    <button onclick="connect()">Connect</button>

    <hr>

    <input id="receiver" placeholder="Recipient username">
    <input id="message" placeholder="Enter message">
    <button onclick="sendMessage()">Send</button>

    <div id="messages"></div>

    <script>
        let socket; 

        function connect() {
            const username = document.getElementById("username").value.trim();
            if (!username) return alert("Enter a username!");

            const wsUrl = `ws://127.0.0.1:8000/ws?username=${username}`;
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                console.log("CONNECTED!");
                document.getElementById("messages").innerHTML += `<p><i>Connected as ${username}</i></p>`;
            };

            socket.onmessage = (event) => {
                document.getElementById("messages").innerHTML += `<p>${event.data}</p>`;
            };

            socket.onclose = () => {
                console.log("CONNECTION CLOSED");
            };
        }

        function sendMessage() {
            const receiver = document.getElementById("receiver").value.trim();
            const message = document.getElementById("message").value.trim();

            if (!socket || socket.readyState !== WebSocket.OPEN) {
                return alert("You must connect first!");
            }
            if (!receiver || !message) {
                return alert("Fill in both receiver and message!");
            }

            const payload = {
                receiver: receiver,
                message: message
            };

            socket.send(JSON.stringify(payload));
            
            document.getElementById("message").value = "";
        }
    </script>

</body>
</html>
